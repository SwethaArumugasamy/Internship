<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component</title>
    <style>
        .card {
            border: 1px solid rgb(189, 53, 53);
            padding: 15px;
            width: 200px;
        }

        body {
            display: flex;
            justify-content: center;
        }

        h3 {
            color: maroon;
        }
    </style>
</head>

<body>
    <div class="card">
        <h3>Title</h3>
        <p>Description</p>
    </div>
</body>

</html>
